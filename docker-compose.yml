version: "3.9"

services:
  server:
    build: ./server
    container_name: backend
    ports:
      - "5002:5002"
    volumes:
      - ./server:/app
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - PORT=5002
    command: sh -c "npm run generate && npm run db:push && npm run dev"

  client:
    build: ./client
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_BASE_URL=http://server:5002/api
    stdin_open: true
    depends_on:
      - server
