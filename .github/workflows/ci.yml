name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  client-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run lint
      - run: npm run build


  server-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      DATABASE_URL: "mongodb://127.0.0.1:27017/capstone_test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npm test
