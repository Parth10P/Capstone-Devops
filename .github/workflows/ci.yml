name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  client-ci:
    name: Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linter
        run: npm run lint

      # Client does not have tests configured yet, but we will test the build process to ensure it compiles
      - name: Build tests (Validate Build)
        run: npm run build


  server-ci:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma migrate deploy

      - name: Run tests
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm test
